name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build WitchTower.exe
    runs-on: windows-latest

    steps:
      - name: Check out project
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          architecture: "x64"
          cache: "pip"
          cache-dependency-path: requirements-build.txt

      - name: Install build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Check Python source
        shell: pwsh
        run: |
          python -m compileall -q .

      - name: Build WitchTower.exe
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean WitchTower.spec

      - name: Verify executable exists
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/WitchTower.exe")) {
            throw "dist/WitchTower.exe was not created."
          }

          $size = (Get-Item "dist/WitchTower.exe").Length
          Write-Host "Built WitchTower.exe ($size bytes)"

      - name: Create SHA256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist/WitchTower.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  WitchTower.exe" | Out-File -Encoding ascii "dist/WitchTower.exe.sha256"
          Get-Content "dist/WitchTower.exe.sha256"

      - name: Upload Actions build artifact
        uses: actions/upload-artifact@v7
        with:
          name: WitchTower-Windows
          path: |
            dist/WitchTower.exe
            dist/WitchTower.exe.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $exe = "dist/WitchTower.exe"
          $checksum = "dist/WitchTower.exe.sha256"

          gh release view $tag *> $null

          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; replacing its build assets."
            gh release upload $tag $exe $checksum --clobber
          }
          else {
            Write-Host "Creating GitHub Release $tag."
            gh release create $tag $exe $checksum `
              --verify-tag `
              --generate-notes `
              --title "The Witch Tower $tag"
          }
