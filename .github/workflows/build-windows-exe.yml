name: Build and Release Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build WitchTower.exe
    runs-on: windows-latest

    steps:
      - name: Check out project
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          architecture: "x64"
          cache: "pip"
          cache-dependency-path: requirements-build.txt

      - name: Install build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Check Python source
        shell: pwsh
        run: |
          python -m compileall -q .

      - name: Build WitchTower.exe
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean WitchTower.spec

      - name: Verify executable exists
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/WitchTower.exe")) {
            throw "dist/WitchTower.exe was not created."
          }

          $size = (Get-Item "dist/WitchTower.exe").Length
          Write-Host "Built WitchTower.exe ($size bytes)"

      - name: Create SHA256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist/WitchTower.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  WitchTower.exe" | Out-File -Encoding ascii "dist/WitchTower.exe.sha256"
          Get-Content "dist/WitchTower.exe.sha256"

      - name: Upload Actions build artifact
        uses: actions/upload-artifact@v7
        with:
          name: WitchTower-Windows
          path: |
            dist/WitchTower.exe
            dist/WitchTower.exe.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Choose Release name and tag
        id: release_info
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -like "refs/tags/v*") {
            $tag = "${{ github.ref_name }}"
            $title = "The Witch Tower $tag"
          }
          else {
            $tag = "build-${{ github.run_number }}"
            $title = "The Witch Tower Build #${{ github.run_number }}"
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "title=$title" >> $env:GITHUB_OUTPUT

          Write-Host "Release tag: $tag"
          Write-Host "Release title: $title"

      - name: Publish to GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.release_info.outputs.tag }}"
          $title = "${{ steps.release_info.outputs.title }}"
          $exe = "dist/WitchTower.exe"
          $checksum = "dist/WitchTower.exe.sha256"

          gh release view $tag *> $null

          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; updating assets."
            gh release upload $tag $exe $checksum --clobber
          }
          else {
            Write-Host "Creating published GitHub Release $tag."

            if ("${{ github.ref }}" -like "refs/tags/v*") {
              gh release create $tag $exe $checksum `
                --generate-notes `
                --title $title
            }
            else {
              gh release create $tag $exe $checksum `
                --target "${{ github.sha }}" `
                --generate-notes `
                --title $title
            }
          }
